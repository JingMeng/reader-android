apply plugin: 'com.android.application'

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += [
        '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
    ]
}

android {
    buildFeatures { buildConfig true }
    namespace 'com.yuenov.open'
    compileSdk 34
    defaultConfig {
        applicationId "com.yuenov.open"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0.1"

        //???renderscript ?????        renderscriptTargetApi 26
        renderscriptSupportModeEnabled true

        flavorDimensions "default"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    productFlavors {
        develop {
            manifestPlaceholders = [
                    CHANNEL_VALUE : "develop",
            ]
        }
        googlePlay {
            manifestPlaceholders = [
                    CHANNEL_VALUE : "googlePlay",
            ]
        }
        other {
            manifestPlaceholders = [
                    CHANNEL_VALUE : "other",
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // ??????
    implementation('com.github.chkmouse-1:rrLibrary:1.0.132') {
        exclude group: 'com.android.support'
    }

    // eventBus
    implementation 'org.greenrobot:eventbus:3.0.0'

    // banner https://github.com/youth5201314/banner
    implementation 'com.youth.banner:banner:1.4.10'

    // butterKnife  https://github.com/JakeWharton/butterknife
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    // ?????  https://github.com/gyf-dev/ImmersionBar
    implementation 'com.gyf.immersionbar:immersionbar:3.0.0'

    // glide
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
    // ???
    implementation 'com.github.pinguo-zhouwei:EasyBlur:v1.0.0'

    // brvah    https://github.com/CymChad/BaseRecyclerViewAdapterHelper
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.47'

    // room
    implementation 'androidx.room:room-runtime:2.4.3'
    annotationProcessor 'androidx.room:room-compiler:2.4.3'

    implementation 'com.github.devlight.shadowlayout:library:1.0.2'


    // ???????????    debugImplementation 'com.amitshekhar.android:debug-db:1.0.6'

    // ??? https://github.com/hongyangAndroid/FlowLayout
    implementation 'com.hyman:flowlayout-lib:1.1.2'

    // ??? https://github.com/limxing/Android-PromptDialog
    implementation 'com.github.limxing:Android-PromptDialog:1.1.3'

    // ImmersionBar
    // ?????????????????    implementation 'com.gyf.immersionbar:immersionbar:3.0.0'
    // fragment?????????????
    implementation 'com.gyf.immersionbar:immersionbar-components:3.0.0'

    implementation 'com.github.githubwing:ByeBurger:1.2.3'
}


